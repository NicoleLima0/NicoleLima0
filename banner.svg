<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Nicole Lima, Desenvolvedora de Software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12061f"/>
      <stop offset="0.55" stop-color="#2a0d45"/>
      <stop offset="1" stop-color="#4b1149"/>
    </linearGradient>
    <linearGradient id="chrome" spreadMethod="repeat" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0">
      <stop offset="0" stop-color="#f7c8ff"/>
      <stop offset="0.25" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c08cff"/>
      <stop offset="0.75" stop-color="#ff8fd2"/>
      <stop offset="1" stop-color="#f7c8ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5fc0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff8fd2"/>
      <stop offset="1" stop-color="#a66bff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1">
      <stop offset="0" stop-color="#ff5fc0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5fc0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2">
      <stop offset="0" stop-color="#8f5bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8f5bff" stop-opacity="0"/>
    </radialGradient>
    <path id="spark" d="M0-20C2-5 5-2 20 0 5 2 2 5 0 20-2 5-5 2-20 0-5-2-2-5 0-20Z"/>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <circle cx="1040" cy="60" r="280" fill="url(#glow1)"/>
  <circle cx="130" cy="280" r="300" fill="url(#glow2)"/>

  <g fill="#ffffff">
    <use href="#spark" transform="translate(150 80) scale(1.3)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" transform="translate(1060 235) scale(1.5)">
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" transform="translate(1000 75) scale(0.7)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" transform="translate(225 245) scale(0.6)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" transform="translate(90 190) scale(0.45)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/>
    </use>
    <use href="#spark" transform="translate(1125 130) scale(0.5)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/>
    </use>
  </g>

  <text x="600" y="168" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="1" fill="url(#chrome)">Nicole Lima</text>
  <rect x="350" y="196" width="500" height="2" fill="url(#line)"/>
  <text x="600" y="240" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="500" letter-spacing="7" fill="#efd9ff">DESENVOLVEDORA DE SOFTWARE</text>
</svg>
